workflows:
  appnext-ios:
    name: APPNEXT IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.horizon9614.emerald5763
    scripts:
    - name: Unpack APPNEXT source
      script: "set -e\npython3 - <<'PYCODE'\nfrom pathlib import Path, PurePosixPath\n\
        import zipfile\nwith zipfile.ZipFile('APPNEXT-Source.zip') as archive:\n \
        \   for entry in archive.infolist():\n        path = PurePosixPath(entry.filename)\n\
        \        if path.is_absolute() or '..' in path.parts or path.parts[0] != 'APPNEXT':\n\
        \            raise SystemExit('Unexpected source archive path')\n    archive.extractall('appnext-source')\n\
        if not Path('appnext-source/APPNEXT/ios/project.yml').is_file():\n    raise\
        \ SystemExit('Missing APPNEXT project')\nPYCODE\n"
    - name: Generate Xcode project
      script: 'set -e

        brew install xcodegen

        cd appnext-source/APPNEXT/ios

        xcodegen generate

        '
    - name: Apply uploaded signing identities
      script: xcode-project use-profiles
    - name: Build APPNEXT
      script: 'xcode-project build-ipa --project appnext-source/APPNEXT/ios/APPNEXT.xcodeproj
        --scheme APPNEXT

        '
    - name: Set downloadable filename
      script: "python3 - <<'PY'\nfrom pathlib import Path\nimport shutil\nfiles =\
        \ list(Path('build/ios/ipa').glob('*.ipa'))\nif len(files) != 1:\n    raise\
        \ SystemExit('Expected exactly one exported IPA')\nPath('artifacts').mkdir(exist_ok=True)\n\
        shutil.copyfile(files[0], 'artifacts/Next.ipa')\nPY\n"
    artifacts:
    - artifacts/Next.ipa
    - /tmp/xcodebuild_logs/*.log
