workflows:
  appnext-local-signing:
    name: APPNEXT Local Signing IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.horizon9614.emerald5763
    scripts:
      - name: Extract local signing project
        script: |
          set -e
          mkdir -p local-signing
          unzip -o APPNEXT-LocalSigning.zip -d local-signing
          brew install xcodegen
          cd local-signing
          xcodegen generate
      - name: Apply uploaded signing identities
        script: |
          cd local-signing
          xcode-project use-profiles
      - name: Build APPNEXT with local signer
        script: |
          cd local-signing
          xcode-project build-ipa --project APPNEXT.xcodeproj --scheme APPNEXT
      - name: Prepare IPA artifact
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          files = list(Path('local-signing/build/ios/ipa').glob('*.ipa'))
          if len(files) != 1:
              raise SystemExit('Expected exactly one exported IPA')
          Path('artifacts').mkdir(exist_ok=True)
          shutil.copyfile(files[0], 'artifacts/Next.ipa')
          PY
    artifacts:
      - artifacts/Next.ipa
      - /tmp/xcodebuild_logs/*.log
