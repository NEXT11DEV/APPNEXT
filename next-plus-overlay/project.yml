name: TAIFPlus
options:
  bundleIdPrefix: app.taifplus
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"
    ENABLE_DEBUG_DYLIB: "NO"

  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: 2

targets:
  iStore:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "ContentView.swift"
          - "Views/ImportApplicationSheet.swift"
          - "Views/AboutView.swift"
          - "Views/UpdatesSheet.swift"
          - "Views/DylibInjectionSection.swift"
          - "Views/LibraryView.swift"
          - "Views/AppsView.swift"
          - "Views/AppImportSheets.swift"
          - "Views/IPAPreflightCard.swift"
          - "Design/ForgeBackdrop.swift"
          - "Design/DesignTokens.swift"
          - "Design/GlassEffects.swift"
          - "Design/ForgeGlassLogo.swift"
          - "Design/ForgeComponents.swift"
      - path: Bridge
      - path: vendor/zsign
        excludes:
          - "zsign.cpp"
          - "third-party/minizip/iowin32.c"
          - "third-party/minizip/iowin32.h"
          - "third-party/minizip/mztools.c"
          - "third-party/minizip/mztools.h"
    resources:
      - path: App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.taifplus.store
        PRODUCT_NAME: TAIFPlus
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Bridge/ForgeSignBridge.h
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: FORGE_BRIDGE
        CLANG_CXX_LANGUAGE_STANDARD: c++11
        CLANG_CXX_LIBRARY: libc++
        GCC_C_LANGUAGE_STANDARD: gnu11
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/vendor/zsign
          - $(SRCROOT)/vendor/zsign/common
          - $(SRCROOT)/vendor/zsign/third-party/zlib
          - $(SRCROOT)/vendor/openssl/include
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/vendor/openssl
        OTHER_LDFLAGS:
          - -lcrypto
          - -lssl
        GCC_PREPROCESSOR_DEFINITIONS:
          - ZSIGN_VERSION=0.1.0

  # UI-preview target for the iOS Simulator. The real app is device-only (the
  # vendored OpenSSL has no simulator slice), so this target compiles just the
  # SwiftUI/App layer WITHOUT the zsign bridge or OpenSSL — no FORGE_BRIDGE, no
  # bridging header, no link flags. Signing is stubbed (see SigningService), but
  # layout, navigation and the Sources/repo networking all run in the simulator.
  # Safe to delete if you don't want a simulator preview build.
  iStoreUISim:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "ContentView.swift"
          - "Views/ImportApplicationSheet.swift"
          - "Views/AboutView.swift"
          - "Views/UpdatesSheet.swift"
          - "Views/DylibInjectionSection.swift"
          - "Views/LibraryView.swift"
          - "Views/AppsView.swift"
          - "Views/AppImportSheets.swift"
          - "Views/IPAPreflightCard.swift"
          - "Design/ForgeBackdrop.swift"
          - "Design/DesignTokens.swift"
          - "Design/GlassEffects.swift"
          - "Design/ForgeGlassLogo.swift"
          - "Design/ForgeComponents.swift"
    resources:
      - path: App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.taifplus.store.uisim
        PRODUCT_NAME: TAIFPlusUISim
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

