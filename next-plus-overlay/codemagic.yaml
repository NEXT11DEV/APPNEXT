workflows:
  ios-unsigned:
    name: idk plus Unsigned IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Generate project
        script: |
          set -e
          brew install xcodegen
          xcodegen generate
      - name: Archive and package unsigned IPA
        script: |
          set -e
          xcodebuild -project IDKPlus.xcodeproj -scheme iStore \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/IDKPlus.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' archive
          mkdir -p build/ipa/Payload
          cp -R build/IDKPlus.xcarchive/Products/Applications/IDKPlus.app build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry ../idk-plus-unsigned.ipa Payload
    artifacts:
      - build/idk-plus-unsigned.ipa

