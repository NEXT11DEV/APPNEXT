name: Publish TAIF PLUS download
on:
  push:
    branches: [taif-panel]
    paths: ['.github/workflows/release-store.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: taif-plus-unsigned-IPA
          github-token: ${{ github.token }}
          run-id: 40731930524
          path: release
      - name: Verify and name the public download
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,plistlib
          p=Path('release/taif-plus-unsigned.ipa')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='53662c70f1f30a93f285648a45c45a55ea5110b2bf0b6c65233de257159be0f0'
          with zipfile.ZipFile(p) as z:
              info=plistlib.loads(z.read('Payload/TAIFPlus.app/Info.plist'))
              assert info['CFBundleIdentifier']=='app.taifplus.store' and info['CFBundleShortVersionString']=='1.3.0'
              assert not any(n.lower().endswith(('.pem','.p12','.mobileprovision')) for n in z.namelist())
          p.rename('release/taif-plus-1.3.0-unsigned.ipa')
          PY
      - name: Publish verified unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view taif-v1.3.0 >/dev/null 2>&1; then
            gh release view taif-v1.3.0 --json assets --jq '.assets[].name' | rg '^taif-plus-1.3.0-unsigned.ipa$'
          else
            gh release create taif-v1.3.0 release/taif-plus-1.3.0-unsigned.ipa --target 508b3059dfe2120a3a57a30e074e56278b6b4543 --title 'TAIF PLUS 1.3.0' --notes 'Unsigned IPA for iOS 15 and later. Sign with your own valid P12 and provisioning profile. Supports device-bound short activation codes. No signing certificate or owner private key is included.'
          fi
