name: Publish idk plus download
on:
  push:
    branches: [idk-panel]
    paths: ['.github/workflows/release-store.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: idk-plus-unsigned-IPA
          github-token: ${{ github.token }}
          run-id: 40326164267
          path: release
      - name: Verify and name the public download
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,plistlib
          p=Path('release/idk-plus-unsigned.ipa')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='f219576921f134df460595bcdb3859e7fc5d35a55c7f04f169a8eea0c4ba2c79'
          with zipfile.ZipFile(p) as z:
              info=plistlib.loads(z.read('Payload/IDKPlus.app/Info.plist'))
              assert info['CFBundleIdentifier']=='app.idkplus.store' and info['CFBundleShortVersionString']=='1.6.0'
              assert not any(n.lower().endswith(('.pem','.p12','.mobileprovision')) for n in z.namelist())
          p.rename('release/idk-plus-1.6.0-unsigned.ipa')
          PY
      - name: Publish verified unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view idk-v1.6.0 >/dev/null 2>&1; then
            gh release view idk-v1.6.0 --json assets --jq '.assets[].name' | rg '^idk-plus-1.6.0-unsigned.ipa$'
          else
            gh release create idk-v1.6.0 release/idk-plus-1.6.0-unsigned.ipa --target d0b6bc4420d42d4c1f592ba5bf258d4a3ae50acb --title 'idk plus 1.6.0' --notes 'Unsigned IPA for iOS 15 and later. Sign with your own valid P12 and provisioning profile. Supports device-bound short activation codes. No signing certificate or owner private key is included.'
          fi
