name: Build NEXT PlUS IPA
on:
  push:
    branches: [next-plus-build]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: next-plus-build-${{ github.sha }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble pinned iStore engine and NEXT PlUS source
        run: |
          set -euo pipefail
          git init build-source
          git -C build-source remote add origin https://github.com/hggdet/iStore-iOS.git
          git -C build-source fetch --depth 1 origin fdefea2617b27374dbb79de9b23f05a728cdbe3b
          git -C build-source checkout --detach FETCH_HEAD
          cp -R next-plus-overlay/. build-source/
      - name: Verify Xcode and generate project
        working-directory: build-source
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
      - name: Test signing policy and real loopback transport
        working-directory: build-source
        run: |
          set -euo pipefail
          swiftc -swift-version 6 App/Services/NextSigningPolicy.swift App/LocalInstallServer.swift Tests/Transport/Checks.swift -o /tmp/next-transport-tests
          /tmp/next-transport-tests
      - name: Check default source migration and live NEXTDEV catalog
        working-directory: build-source
        run: python3 Tests/Sources/run.py
      - name: Exercise native zsign bridge with disposable fixtures
        working-directory: build-source
        run: |
          set -euo pipefail
          if ! brew --prefix openssl@3 >/dev/null 2>&1; then brew install openssl@3; fi
          python3 Tests/NativeSmoke/run.py
      - name: Verify live HTTPS install manifest
        working-directory: build-source
        run: python3 Tests/Manifest/check.py
      - name: Compile NEXT PlUS
        working-directory: build-source
        run: |
          set -euo pipefail
          xcodebuild -project NextPlus.xcodeproj -scheme iStore \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/NextPlus.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' archive
      - name: Package unsigned IPA
        working-directory: build-source
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          cp -R build/NextPlus.xcarchive/Products/Applications/NextPlus.app build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry ../NEXT-PlUS-unsigned.ipa Payload
      - name: Audit packaged iOS 15 compatibility
        working-directory: build-source
        run: python3 Tests/Packaging/check.py build/NEXT-PlUS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: NEXT-PlUS-unsigned-IPA
          path: build-source/build/NEXT-PlUS-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Build simulator and capture real interface
        working-directory: build-source
        run: |
          set -euo pipefail
          xcodebuild -project NextPlus.xcodeproj -scheme iStoreUISim -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build > build/sim-build.log 2>&1 || { tail -100 build/sim-build.log; exit 1; }
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/sim/Build/Products/Debug-iphonesimulator/NextPlusUISim.app
          mkdir -p build/screenshots
          for TAB in 0 1 2; do
            SIMCTL_CHILD_NEXT_UI_PREVIEW=1 SIMCTL_CHILD_NEXT_UI_TAB="$TAB" xcrun simctl launch "$DEVICE" app.nextplus.store.uisim
            sleep 5
            xcrun simctl io "$DEVICE" screenshot "build/screenshots/tab-$TAB.png"
            xcrun simctl terminate "$DEVICE" app.nextplus.store.uisim
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXT-PlUS-validation
          path: |
            build-source/build/screenshots
            build-source/build/sim-build.log
          retention-days: 7
